name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tooling
        run: pip install ruff==0.8.4
      - name: Lint
        run: ruff check contracts tests scripts
      - name: Static deploy checks
        run: python scripts/check_contracts.py
      - name: Offline tests
        run: python -m unittest discover -s tests -t tests -v
      - name: Build deployable contracts
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: workwitness-contracts
          path: dist/

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: |
          node --check frontend/app.js
          node --check frontend/lib.js
          node --check frontend/config.js
      - name: Frontend helper tests
        run: node --test tests/frontend/lib.test.mjs
